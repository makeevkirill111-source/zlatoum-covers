# Сторож контент-завода ВНЕ сервера (13.09.2026, дедуп и Штаб — 04.10.2026).
# Сервер (zlatoum-smm/deploy/deadman.py) раз в сутки кладёт сюда heartbeat.json.
# Здесь раз в час смотрим его возраст: старше 26 часов или ok=false — тревога.
# Логика и тесты — .github/deadman.py, tests/test_deadman.py.
#
# Тревога уходит в тему «smm» Штаба (секреты HUB_BOT_TOKEN, HUB_CHAT_ID, HUB_TOPIC_SMM), а если
# Штаб не принял или его секретов нет — личным сообщением SMM-ботом (ZLATOUM_SMM_BOT_TOKEN,
# ZLATOUM_SMM_EDITOR_ID). Первая — в первом запуске после беды, дальше раз в 12 часов, пока пульс
# не оживёт: время последней тревоги держит кэш Actions (ключ deadman-alert-<номер запуска>).
# Запуск, в котором тревога ушла (или не смогла уйти), красный — об этом GitHub пишет владельцу
# письмом сам, без секретов; запуски «беда та же, но тревога уже была» зелёные.
#
# Проверка: ветка-песочница с подложенным старым heartbeat.json → Actions → deadman → Run workflow
# на этой ветке → ровно одно сообщение; второй запуск в тот же час молчит. Кэш ветки-песочницы
# от кэша main отдельный, боевое время тревоги проба не сдвинет.
name: deadman

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadman

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Когда била последняя тревога
        uses: actions/cache/restore@v4
        with:
          path: .deadman
          # Заведомо несуществующий ключ: нужен только поиск по restore-keys — самый свежий кэш
          # с этим началом имени (его время и есть «последняя тревога»).
          key: deadman-alert-none
          restore-keys: deadman-alert-
      - name: Возраст пульса
        id: check
        env:
          HUB_BOT_TOKEN: ${{ secrets.HUB_BOT_TOKEN }}
          HUB_CHAT_ID: ${{ secrets.HUB_CHAT_ID }}
          HUB_TOPIC_SMM: ${{ secrets.HUB_TOPIC_SMM }}
          ZLATOUM_SMM_BOT_TOKEN: ${{ secrets.ZLATOUM_SMM_BOT_TOKEN }}
          ZLATOUM_SMM_EDITOR_ID: ${{ secrets.ZLATOUM_SMM_EDITOR_ID }}
        run: python3 .github/deadman.py
      - name: Запомнить тревогу
        if: steps.check.outputs.state == 'alerted'
        uses: actions/cache/save@v4
        with:
          path: .deadman
          key: deadman-alert-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Красный прогон — письмо от GitHub
        if: steps.check.outputs.state == 'alerted' || steps.check.outputs.state == 'failed'
        run: exit 1
